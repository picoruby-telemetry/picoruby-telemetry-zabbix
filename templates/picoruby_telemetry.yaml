zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 75fb2d4d5d8842fbb4579c0902643a67
      name: Templates/Applications
  templates:
    - uuid: 7c91efb3b8534f6cbbeb6b32a45e4bdb
      template: PicoRuby Telemetry
      name: PicoRuby Telemetry
      groups:
        - name: Templates/Applications
      items:
        - uuid: 17b8d0386d9b4a78899d4922a614a7de
          name: PicoRuby log
          type: TRAP
          key: picoruby.log
          delay: '0'
          value_type: LOG
        - uuid: 42cb302154ff44708972d68afd41db3f
          name: Temperature
          type: TRAP
          key: 'picoruby.metric[temperature]'
          delay: '0'
          value_type: FLOAT
        - uuid: ab86bf2c61154c529a4ca8f06bf7976b
          name: Sensor check
          type: TRAP
          key: 'picoruby.check[sensor]'
          delay: '0'
          value_type: UNSIGNED
          triggers:
            - uuid: 1f74dd6277234a9da1d9150f1f13c419
              expression: 'last(/PicoRuby Telemetry/picoruby.check[sensor])>=2'
              name: PicoRuby sensor check critical
              priority: HIGH
        - uuid: b4eaeb8eddc94fc097498ac7da540417
          name: PicoRuby heartbeat
          type: TRAP
          key: picoruby.heartbeat
          delay: '0'
          value_type: UNSIGNED
          triggers:
            - uuid: a1bd0723dfb8432896d9e253d0a78a6f
              expression: 'nodata(/PicoRuby Telemetry/picoruby.heartbeat,5m)=1'
              name: PicoRuby heartbeat missing
              priority: HIGH
        - uuid: 0413759c54a54273b4004725189db726
          name: Sensor check message
          type: TRAP
          key: 'picoruby.check.msg[sensor]'
          delay: '0'
          value_type: TEXT
